name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 배포는 한 번에 하나만. 진행 중인 배포는 끊지 않고 다음 것이 기다린다.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/seoulution/balba-frontend
  SITE_URL: https://balba.duckdns.org

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  build:
    needs: check
    # 운영 서버가 ARM64 라서 ARM 러너에서 네이티브로 빌드한다.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # 서버의 배포 키는 deploy.sh 만 실행하도록 묶여 있다: "<service> <image-tag>"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" "frontend $GITHUB_SHA"

      - name: Verify deployed version
        run: |
          for i in $(seq 1 12); do
            body="$(curl -fsS --max-time 10 "$SITE_URL/version.txt" || true)"
            echo "$body"
            if [ "$body" = "$GITHUB_SHA" ]; then exit 0; fi
            sleep 5
          done
          echo "배포된 버전이 $GITHUB_SHA 가 아닙니다" >&2
          exit 1
